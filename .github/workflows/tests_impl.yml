name: tests_impl

on:
  workflow_call:
    inputs:
        rustflags:
          required: false
          type: string
        cache_type_flag:
          required: true
          type: string
        config_type_flag:
          required: true
          type: string
        features:
          required: true
          type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build tests with default features
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/checkout@v6
    - run: RUSTFLAGS="
             ${{ inputs.rustflags }}
             --cfg ${{ inputs.cache_type_flag }}
             --cfg ${{ inputs.config_type_flag }}
           " cargo build --tests

  tests:
    name: careful tests
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@nightly
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-careful
    - uses: actions/checkout@v6
    - run: RUSTFLAGS="
             ${{ inputs.rustflags }}
             --cfg ${{ inputs.cache_type_flag }}
             --cfg ${{ inputs.config_type_flag }}
           " cargo +nightly careful test --lib --examples --tests --no-default-features --features ${{ inputs.features }}

  miri:
    name: miri tests
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: miri
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: actions/checkout@v6
    - run:
        MIRIFLAGS="-Zmiri-disable-isolation"
        RUSTFLAGS="
             ${{ inputs.rustflags }}
             --cfg ${{ inputs.cache_type_flag }}
             --cfg ${{ inputs.config_type_flag }}
           " cargo +nightly miri nextest run -j6 --no-default-features --features ${{ inputs.features }}

  # GitHub has no big-endian runners. Miri interprets the tests for a
  # big-endian target instead, so the `target_endian = "big"` code is
  # compiled and executed.
  miri_big_endian:
    name: miri tests big-endian
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: miri
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: actions/checkout@v6
    - run:
        MIRIFLAGS="-Zmiri-disable-isolation"
        RUSTFLAGS="
             ${{ inputs.rustflags }}
             --cfg ${{ inputs.cache_type_flag }}
             --cfg ${{ inputs.config_type_flag }}
           " cargo +nightly miri nextest run -j6 --no-default-features --features ${{ inputs.features }} --target s390x-unknown-linux-gnu